# One folder serves every junction. Copy a block per junction; the Pi
# selects its block via JUNCTION_ID in .env. Camera indices are the
# /dev/videoN numbers on THAT Pi (verify with v4l2-ctl --list-devices).
junctions:
  BENZ-CIRCLE:
    cameras:
      - id: north
        video_index: 0
        roi: []          # [[x,y],...] in original-frame pixels; [] = full frame
        counting_line: []  # [[x1,y1],[x2,y2]]
      - id: east
        video_index: 1
        roi: []
        counting_line: []
      - id: south
        video_index: 2
        roi: []
        counting_line: []
      - id: west
        video_index: 3
        roi: []
        counting_line: []

controller:
  min_green_s: 10
  max_green_s: 60
  yellow_s: 4
  smoothing_window_s: 5
