services:
  db:
    image: postgres:16-alpine
    container_name: seedgrant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trafficdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trafficdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated demo database for the local simulator (plan.md §4.7): dedicated
  # container + database, never points at live data. Runs on host port 5433
  # so it coexists with the dev db service.
  db-demo:
    image: postgres:16-alpine
    container_name: seedgrant-db-demo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trafficdb_demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trafficdb_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  pgdata_demo:
